line-length = 120
exclude = [
    "**/migrations/**",
    "*/static/CACHE/*",
    "venv",
    "docs",
]

[lint]
ignore = ["RUF012", "FLY002"]
extend-select = [
    "E",
    "F",
    "W", # pycodestyle warnings
    "I", # isort
    "DJ", # flake8-django
    "E501", # line-too-long
]
extend-safe-fixes = ["C408"]

[lint.isort]
known-first-party = ["gregor_django", "config", ]

[lint.per-file-ignores]
"*/management/commands/sync-drupal-data.py" = ["N999"]
